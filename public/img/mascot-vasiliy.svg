<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" role="img" aria-label="Кот Василий">
  <!-- хвост трубой -->
  <rect x="142" y="72" width="14" height="74" rx="7" fill="#FFA54D"/>
  <rect x="142" y="72" width="14" height="10" rx="5" fill="#B5722E"/>
  <rect x="142" y="90" width="14" height="7" rx="3.5" fill="#B5722E" opacity="0.7"/>
  <!-- тело: почти шар -->
  <circle cx="88" cy="132" r="52" fill="#FFA54D"/>
  <!-- полоски на боках -->
  <path d="M42 118 q10 6 8 16" fill="none" stroke="#B5722E" stroke-width="6" stroke-linecap="round"/>
  <path d="M134 118 q-10 6 -8 16" fill="none" stroke="#B5722E" stroke-width="6" stroke-linecap="round"/>
  <!-- грудка -->
  <ellipse cx="88" cy="150" rx="27" ry="28" fill="#FFF4E5"/>
  <!-- лапки короткие -->
  <ellipse cx="66" cy="180" rx="13" ry="9" fill="#FFF4E5" stroke="#B5722E" stroke-width="2"/>
  <ellipse cx="110" cy="180" rx="13" ry="9" fill="#FFF4E5" stroke="#B5722E" stroke-width="2"/>
  <!-- голова -->
  <circle cx="88" cy="72" r="40" fill="#FFA54D"/>
  <!-- уши -->
  <path d="M54 48 L58 18 L82 38 Z" fill="#FFA54D"/>
  <path d="M122 48 L118 18 L94 38 Z" fill="#FFA54D"/>
  <path d="M62 42 L63 28 L75 38 Z" fill="#E8A0A0"/>
  <path d="M114 42 L113 28 L101 38 Z" fill="#E8A0A0"/>
  <!-- полоски на лбу -->
  <rect x="80" y="34" width="5" height="14" rx="2.5" fill="#B5722E"/>
  <rect x="90" y="33" width="5" height="15" rx="2.5" fill="#B5722E"/>
  <!-- глаза: большие, круглые, серо-зелёные -->
  <circle cx="72" cy="70" r="11" fill="#FFFDF7"/>
  <circle cx="104" cy="70" r="11" fill="#FFFDF7"/>
  <circle cx="73" cy="71" r="7" fill="#9DB08A"/>
  <circle cx="103" cy="71" r="7" fill="#9DB08A"/>
  <circle cx="73" cy="71" r="3.6" fill="#333333"/>
  <circle cx="103" cy="71" r="3.6" fill="#333333"/>
  <circle cx="75" cy="69" r="1.4" fill="#FFFFFF"/>
  <circle cx="105" cy="69" r="1.4" fill="#FFFFFF"/>
  <!-- нос и рот -->
  <path d="M84 84 h8 l-4 6 z" fill="#E8A0A0"/>
  <path d="M88 90 v4 M88 94 q-5 5 -10 1 M88 94 q5 5 10 1" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
  <!-- усы -->
  <g stroke="#333333" stroke-width="1.6" stroke-linecap="round">
    <line x1="60" y1="84" x2="30" y2="78"/>
    <line x1="60" y1="90" x2="28" y2="90"/>
    <line x1="60" y1="96" x2="32" y2="102"/>
    <line x1="116" y1="84" x2="146" y2="78"/>
    <line x1="116" y1="90" x2="148" y2="90"/>
    <line x1="116" y1="96" x2="144" y2="102"/>
  </g>
</svg>
