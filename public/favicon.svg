<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Пилюля LEVKEYSER: капсула под наклоном, две половины фирменных цветов -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0A418"/>
      <stop offset="1" stop-color="#B4601C"/>
    </linearGradient>
    <clipPath id="capsule">
      <rect x="7" y="20" width="50" height="24" rx="12"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#211A12"/>
  <g transform="rotate(-38 32 32)">
    <g clip-path="url(#capsule)">
      <rect x="7" y="20" width="25" height="24" fill="#F7F3EA"/>
      <rect x="32" y="20" width="25" height="24" fill="url(#gold)"/>
    </g>
    <rect x="7" y="20" width="50" height="24" rx="12" fill="none" stroke="#211A12" stroke-width="3"/>
    <line x1="32" y1="20" x2="32" y2="44" stroke="#211A12" stroke-width="3"/>
    <circle cx="19" cy="32" r="3.6" fill="#B4601C" opacity="0.55"/>
  </g>
</svg>
