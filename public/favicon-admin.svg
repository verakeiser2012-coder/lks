<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Админская пилюля: та же форма, фиолетовые «Сумерки» -->
  <defs>
    <clipPath id="capsuleA">
      <rect x="10" y="22" width="44" height="20" rx="10"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#2A1F33"/>
  <g transform="rotate(-38 32 32)">
    <g clip-path="url(#capsuleA)">
      <rect x="10" y="22" width="22" height="20" fill="#F4EFE6"/>
      <rect x="32" y="22" width="22" height="20" fill="#6B4E7D"/>
    </g>
    <rect x="10" y="22" width="44" height="20" rx="10" fill="none" stroke="#2A1F33" stroke-width="2.5"/>
    <line x1="32" y1="22" x2="32" y2="42" stroke="#2A1F33" stroke-width="2.5"/>
    <circle cx="21" cy="32" r="3.2" fill="#6B4E7D" opacity="0.55"/>
  </g>
</svg>
