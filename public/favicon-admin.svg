<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Админская пилюля: та же форма, фиолетовые «Сумерки» -->
  <defs>
    <clipPath id="capsuleA">
      <rect x="7" y="20" width="50" height="24" rx="12"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#2A1F33"/>
  <g transform="rotate(-38 32 32)">
    <g clip-path="url(#capsuleA)">
      <rect x="7" y="20" width="25" height="24" fill="#F4EFE6"/>
      <rect x="32" y="20" width="25" height="24" fill="#6B4E7D"/>
    </g>
    <rect x="7" y="20" width="50" height="24" rx="12" fill="none" stroke="#2A1F33" stroke-width="3"/>
    <line x1="32" y1="20" x2="32" y2="44" stroke="#2A1F33" stroke-width="3"/>
    <circle cx="19" cy="32" r="3.6" fill="#6B4E7D" opacity="0.55"/>
  </g>
</svg>
